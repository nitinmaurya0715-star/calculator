<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A clean modern calculator built with HTML, CSS and JavaScript." />
  <title>NovaCalc — Modern Calculator</title>
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app-shell">
    <section class="calculator-card" aria-label="Calculator">
      <header class="app-header">
        <div>
          <p class="eyebrow">JAVASCRIPT PROJECT 01</p>
          <h1>NovaCalc</h1>
        </div>
        <button class="icon-button" id="themeToggle" type="button" aria-label="Toggle color theme" title="Toggle theme">☼</button>
      </header>

      <div class="display" aria-live="polite">
        <div class="display-expression" id="expression">Ready to calculate</div>
        <output class="display-result" id="result">0</output>
      </div>

      <div class="calculator-toolbar">
        <span><kbd>Bksp</kbd> delete</span>
        <button class="text-button" id="historyToggle" type="button">History</button>
      </div>

      <div class="keypad" aria-label="Calculator keypad">
        <button class="key key-muted" data-action="clear" type="button">AC</button>
        <button class="key key-muted" data-action="delete" type="button" aria-label="Delete last character">DEL</button>
        <button class="key key-muted" data-action="percent" type="button">%</button>
        <button class="key key-operator" data-value="÷" type="button">÷</button>

        <button class="key" data-value="7" type="button">7</button>
        <button class="key" data-value="8" type="button">8</button>
        <button class="key" data-value="9" type="button">9</button>
        <button class="key key-operator" data-value="×" type="button">×</button>

        <button class="key" data-value="4" type="button">4</button>
        <button class="key" data-value="5" type="button">5</button>
        <button class="key" data-value="6" type="button">6</button>
        <button class="key key-operator" data-value="−" type="button">−</button>

        <button class="key" data-value="1" type="button">1</button>
        <button class="key" data-value="2" type="button">2</button>
        <button class="key" data-value="3" type="button">3</button>
        <button class="key key-operator" data-value="+" type="button">+</button>

        <button class="key key-muted" data-action="sign" type="button">+/−</button>
        <button class="key" data-value="0" type="button">0</button>
        <button class="key" data-action="decimal" type="button">.</button>
        <button class="key key-equals" data-action="equals" type="button">=</button>
      </div>

      <p class="hint">Tip: use your keyboard for a faster calculation.</p>
    </section>

    <aside class="history-panel" id="historyPanel" aria-label="Calculation history" aria-hidden="true">
      <div class="history-heading">
        <div>
          <p class="eyebrow">YOUR ACTIVITY</p>
          <h2>History</h2>
        </div>
        <button class="icon-button" id="closeHistory" type="button" aria-label="Close history">×</button>
      </div>
      <div class="history-list" id="historyList">
        <p class="empty-state">Your calculations will appear here.</p>
      </div>
      <button class="clear-history" id="clearHistory" type="button">Clear history</button>
    </aside>
  </main>
</body>
</html>
